name: Notify of any events today

on:
  schedule:
  - cron: '5 17 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Notify of events
        run: python events